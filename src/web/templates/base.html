<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        News Generator Admin
        {% endblock %}
    </title>

    <style>

        :root {
            --bg: #f5f6f7;
            --surface: #ffffff;
            --border: #dcdfe3;
            --border-soft: #e8eaed;
            --text: #202124;
            --muted: #6b7280;
            --primary: #18434e;
            --primary-hover: #123640;
            --accent: #8dd4d3;
            --danger-bg: #fde2e2;
            --danger-border: #e9a1a1;
            --success-bg: #dcf6df;
            --success-border: #9bd4a2;
            --radius: 10px;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }


        * {
            box-sizing: border-box;
        }


        html {
            min-height: 100%;
        }


        body {
            margin: 0;
            min-height: 100vh;

            background: var(--bg);
            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            line-height: 1.5;
        }


        a {
            color: var(--primary);
            text-decoration: none;
        }


        a:hover {
            text-decoration: underline;
        }


        .site-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);

            position: sticky;
            top: 0;
            z-index: 100;
        }


        .site-header-inner {
            width: min(1400px, calc(100% - 40px));

            margin: 0 auto;

            min-height: 64px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 30px;
        }


        .brand {
            font-size: 18px;
            font-weight: 700;

            color: var(--primary);

            white-space: nowrap;
        }


        .brand:hover {
            text-decoration: none;
        }


        .main-nav {
            display: flex;
            align-items: center;

            gap: 8px;

            flex-wrap: wrap;
        }


        .main-nav a {
            display: inline-flex;
            align-items: center;

            min-height: 38px;

            padding: 8px 13px;

            border-radius: 8px;

            color: var(--text);

            font-weight: 500;
        }


        .main-nav a:hover {
            background: #f0f3f4;
            text-decoration: none;
        }


        .main-nav a.active {
            background: var(--primary);
            color: #ffffff;
        }


        .page {
            width: min(1400px, calc(100% - 40px));

            margin: 0 auto;

            padding: 30px 0 60px;
        }


        h1 {
            margin:
                0
                0
                24px;

            font-size: 30px;
            line-height: 1.2;
        }


        h2 {
            margin:
                0
                0
                16px;

            font-size: 21px;
            line-height: 1.3;
        }


        h3 {
            margin:
                0
                0
                12px;
        }


        p {
            margin:
                0
                0
                14px;
        }


        .card {
            background: var(--surface);

            border:
                1px
                solid
                var(--border);

            border-radius:
                var(--radius);

            padding:
                20px;

            margin-bottom:
                28px;

            box-shadow:
                var(--shadow);
        }


        label {
            color: var(--text);
        }


        input,
        select,
        textarea,
        button {
            font: inherit;
        }


        input[type="text"],
        input[type="number"],
        input[type="url"],
        input[type="file"],
        select,
        textarea {
            width: 100%;

            padding:
                9px
                11px;

            color: var(--text);

            background:
                #ffffff;

            border:
                1px
                solid
                #cfd4d9;

            border-radius:
                7px;

            outline:
                none;
        }


        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="url"]:focus,
        input[type="file"]:focus,
        select:focus,
        textarea:focus {
            border-color:
                var(--primary);

            box-shadow:
                0 0 0 2px
                rgba(24, 67, 78, 0.12);
        }


        textarea {
            line-height: 1.45;
        }


        button {
            appearance: none;

            border: 0;

            border-radius:
                7px;

            padding:
                10px
                15px;

            background:
                var(--primary);

            color:
                #ffffff;

            font-weight:
                600;

            cursor:
                pointer;

            transition:
                background
                0.15s
                ease;
        }


        button:hover {
            background:
                var(--primary-hover);
        }


        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }


        .success {
            background:
                var(--success-bg);

            border:
                1px
                solid
                var(--success-border);

            border-radius:
                8px;

            padding:
                14px;

            margin-bottom:
                20px;

            white-space:
                pre-wrap;
        }


        .error {
            background:
                var(--danger-bg);

            border:
                1px
                solid
                var(--danger-border);

            border-radius:
                8px;

            padding:
                14px;

            margin-bottom:
                20px;

            white-space:
                pre-wrap;
        }


        .muted {
            color:
                var(--muted);
        }


        code {
            padding:
                2px
                5px;

            border-radius:
                5px;

            background:
                #eef1f2;

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                "Liberation Mono",
                monospace;

            font-size:
                0.92em;
        }


        table {
            width:
                100%;

            border-collapse:
                collapse;

            background:
                var(--surface);
        }


        th,
        td {
            padding:
                11px
                12px;

            border-bottom:
                1px
                solid
                var(--border-soft);

            text-align:
                left;

            vertical-align:
                top;
        }


        th {
            background:
                #f7f8f9;

            font-weight:
                600;
        }


        tbody tr:hover {
            background:
                #fafbfb;
        }


        .table-wrapper {
            width:
                100%;

            overflow-x:
                auto;
        }


        .site-footer {
            width:
                min(1400px, calc(100% - 40px));

            margin:
                0 auto;

            padding:
                0
                0
                30px;

            color:
                var(--muted);

            font-size:
                13px;
        }


        @media (
            max-width: 800px
        ) {

            .site-header-inner {
                width:
                    min(
                        100% - 24px,
                        1400px
                    );

                min-height:
                    auto;

                padding:
                    12px
                    0;

                display:
                    block;
            }


            .brand {
                display:
                    block;

                margin-bottom:
                    10px;
            }


            .main-nav {
                gap:
                    4px;
            }


            .page {
                width:
                    min(
                        100% - 24px,
                        1400px
                    );

                padding-top:
                    20px;
            }


            .site-footer {
                width:
                    min(
                        100% - 24px,
                        1400px
                    );
            }


            h1 {
                font-size:
                    25px;
            }

        }

    </style>


    {% block head %}
    {% endblock %}

</head>


<body>

<header class="site-header">

    <div class="site-header-inner">

        <a
            class="brand"
            href="/sources"
        >
            News Generator Admin
        </a>


        <nav class="main-nav">

            <a
                href="/sources"
                class="
                    {% if request.url.path.startswith('/sources') %}
                    active
                    {% endif %}
                "
            >
                Источники
            </a>


            <a
                href="/semantic-units"
                class="
                    {% if request.url.path.startswith('/semantic-units') %}
                    active
                    {% endif %}
                "
            >
                Semantic Units
            </a>


            <a
                href="/atomic-theses"
                class="
                    {% if request.url.path.startswith('/atomic-theses') %}
                    active
                    {% endif %}
                "
            >
                Тезисы
            </a>

        </nav>

    </div>

</header>


<main class="page">

    {% block content %}
    {% endblock %}

</main>


<footer class="site-footer">

    Knowledge Base Admin

</footer>


{% block scripts %}
{% endblock %}

</body>

</html>
